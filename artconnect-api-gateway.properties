spring.application.name=artconnect-api-gateway
server.port=9090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Auth service routing 
spring.cloud.gateway.server.webflux.routes[0].id=artconnect-auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ARTCONNECT-AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Artist service routing

spring.cloud.gateway.server.webflux.routes[1].id=artconnect-artist-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ARTCONNECT-ARTIST-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/artist/**

# Portfolio service routing

spring.cloud.gateway.server.webflux.routes[2].id=artconnect-portfolio-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ARTCONNECT-PORTFOLIO-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/portfolio/**


jwt.secret=8aR9xP2mL5vQ7wXe1Nc4Hd8YkT6uFs3Bg9ZjVr2LmQ5Px8As6Nf7Kb1Dw4Hy9Rt
jwt.access-token-expiration=60000
jwt.refresh-token-expiration=604800000

#License Service routing
spring.cloud.gateway.server.webflux.routes[3].id=artconnect-portfolio-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ARTCONNECT-LICENSE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/licenses/**


# Redis rate limiter
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=5

management.endpoints.web.exposure.include=*
# Zipkin
management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
