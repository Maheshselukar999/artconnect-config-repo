spring.application.name=artconnect-license-service

server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/artconnect_license_db
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=8aR9xP2mL5vQ7wXe1Nc4Hd8YkT6uFs3Bg9ZjVr2LmQ5Px8As6Nf7Kb1Dw4Hy9Rt

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Time Limiter
resilience4j.timelimiter.instances.artistservice.timeout-duration=3s
resilience4j.timelimiter.instances.portfolioservice.timeout-duration=3s

#Feign Timeout
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Actuator
management.endpoints.web.exposure.include=*
# Zipkin
management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
