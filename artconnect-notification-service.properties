#circuit breaker
resilience4j.circuitbreaker.instances.artistservice.sliding-window-size=5
resilience4j.circuitbreaker.instances.artistservice.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.artistservice.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.artistservice.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.artistservice.permitted-number-of-calls-in-half-open-state=2

# Feign Timeout
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000

#actuator
management.endpoints.web.exposure.include=*
# Zipkin
management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
